<!DOCTYPE html>
<html>
<head>
    <title>Sum of Two Numbers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<table>
    <thead>
    <tr>
        <th>S. No.</th>
        <th>Input Method</th>
        <th>Value</th>
    </tr>
    </thead>

    <tbody>
    <tr>
        <td>1</td>
        <td>First Input Field</td>
        <td id="first"></td>
    </tr>
    <tr>
        <td>2</td>
        <td>Second Input Field</td>
        <td id="second"></td>
    </tr>
    <tr>
        <td>3</td>
        <td>Sum</td>
        <td id="output"></td>
    </tr>
    </tbody>
</table>

<script>
    let a = parseInt(prompt("Enter the value of a:"), 10);
    let b = parseInt(prompt("Enter the value of b:"), 10);

    document.getElementById("first").textContent = a;
    document.getElementById("second").textContent = b;
    document.getElementById("output").textContent = a + b;
</script>

</body>
</html>
